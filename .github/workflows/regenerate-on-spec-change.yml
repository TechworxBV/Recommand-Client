name: Regenerate client from spec

# Downloads the live OpenAPI spec into spec/openapi.json, re-runs the
# generator, and opens a PR when either the snapshot or the generated client
# changed. This is how upstream API changes reach the SDK: review the PR,
# bump the version, tag.
#
# The generator fails (and so does this workflow) when the spec changes in a
# way it cannot map on its own, e.g. a new document type without a payload
# mapping in Recommand.Generator/Program.cs. That failure is the signal to
# update the generator by hand.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Fetch live spec and regenerate client
        run: dotnet run --project Recommand.Generator --configuration Release -- --fetch

      - name: Verify regenerated client compiles
        run: dotnet build Recommand.Client/Recommand.Client.csproj --configuration Release

      - name: Run tests against regenerated client
        run: dotnet test recommand-client.sln --configuration Release

      - name: Open pull request if anything changed
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/regen-spec
          delete-branch: true
          commit-message: "chore(spec): update to latest upstream OpenAPI spec"
          title: "chore(spec): update to latest upstream OpenAPI spec"
          labels: |
            spec-update
            automated
          body: |
            Automated PR: the upstream spec at https://peppol.recommand.eu/openapi
            differs from `spec/openapi.json`, or the generator output differs
            from what is checked in.

            ## What changed

            - `spec/openapi.json`: the new upstream snapshot. Its diff is the API change.
            - `Recommand.Client/Generated/`: the regenerated client.

            ## Reviewer checklist

            - [ ] Public surface assessed for breaking changes; version bumped and
                  CHANGELOG updated accordingly.
            - [ ] New webhook event types (not in the spec) added to
                  `spec/webhooks.json` if the docs list any.

            The workflow built the solution and ran the tests before opening this PR.
