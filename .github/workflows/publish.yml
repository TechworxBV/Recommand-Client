name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Derive package version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore recommand-client.sln

      - name: Build
        run: |
          dotnet build recommand-client.sln \
            --configuration Release \
            --no-restore \
            -p:Version=${{ steps.version.outputs.version }} \
            -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test recommand-client.sln --configuration Release --no-build

      # Pack the whole solution. Only IsPackable=true projects produce a
      # nupkg — currently Recommand.Client and Recommand.Client.AspNetCore.
      # Test projects and the build-time generator are excluded via their
      # csproj. Adding a new packable project requires no change here.
      - name: Pack
        run: |
          dotnet pack recommand-client.sln \
            --configuration Release \
            --no-build \
            --output ${{ runner.temp }}/packages \
            -p:Version=${{ steps.version.outputs.version }} \
            -p:ContinuousIntegrationBuild=true

      - name: List packed artefacts
        run: ls -lh "${{ runner.temp }}/packages"

      - name: Upload packages as workflow artefact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ${{ runner.temp }}/packages/*.*nupkg
          if-no-files-found: error
          retention-days: 30

      # `dotnet nuget push` with a wildcard handles every .nupkg in the
      # output directory — both library packages publish in one step,
      # in matching order with their .snupkg symbol packages.
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push "${{ runner.temp }}/packages/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
