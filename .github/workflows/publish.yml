name: Publish to NuGet

# Triggered when a tag matching `v*` is pushed (e.g. `v0.1.0`, `v1.0.0-rc.1`).
# The tag's version (with the leading "v" stripped) becomes the package
# version, overriding whatever <Version> currently lives in the csproj.
#
# Usage:
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Prerequisites (one-time):
#   1. Create a NuGet API key at https://www.nuget.org/account/apikeys
#      (scope: "Push new packages and package versions" for `Recommand.*`)
#   2. Add it as a repo secret named NUGET_API_KEY
#      (Settings → Secrets and variables → Actions → New repository secret)
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Source Link embeds commit SHA + repo URL into the symbols. Shallow
          # clones can confuse it; a full fetch keeps the metadata accurate.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Derive package version from tag
        id: version
        # GITHUB_REF_NAME is the tag (e.g. "v0.1.0"); strip the "v" prefix.
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore recommand-client.sln

      # Build everything once with the version + CI flags so pack can reuse
      # the artefacts (--no-build below).
      - name: Build
        run: |
          dotnet build recommand-client.sln \
            --configuration Release \
            --no-restore \
            -p:Version=${{ steps.version.outputs.version }} \
            -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test recommand-client.sln --configuration Release --no-build

      - name: Pack
        run: |
          dotnet pack Recommand.Client/Recommand.Client.csproj \
            --configuration Release \
            --no-build \
            --output ${{ runner.temp }}/packages \
            -p:Version=${{ steps.version.outputs.version }} \
            -p:ContinuousIntegrationBuild=true

      - name: Upload package as workflow artefact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ${{ runner.temp }}/packages/*.*nupkg
          if-no-files-found: error
          retention-days: 30

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        # `dotnet nuget push` automatically pushes a matching .snupkg sitting
        # next to the .nupkg, so the symbol package goes up too.
        # --skip-duplicate makes re-runs safe if a previous attempt published
        # part-way.
        run: |
          dotnet nuget push "${{ runner.temp }}/packages/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
